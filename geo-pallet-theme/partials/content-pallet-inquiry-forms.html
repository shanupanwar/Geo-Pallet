<script>
document.addEventListener('DOMContentLoaded', function () {
    const dropdown = document.getElementById(
        'form-field-field_bf2b71a'
    );

    if (!dropdown) return;

    const valueToSlug = {
        '2 Way Pallet': '2-way-pallet',
        '4 Way Pallet': '4-way-pallet',
        'Skid Pallet': 'skid-pallet',
        'Wing Pallet': 'wing-pallet',
        'Block Pallet': 'block-pallet',
        'Cribbing': 'cribbing'
    };

    const slugToValue = Object.fromEntries(
        Object.entries(valueToSlug).map(
            ([value, slug]) => [slug, value]
        )
    );

    function normalizeSelection(value) {
        if (!value) return '2-way-pallet';

        const normalized = value
            .trim()
            .toLowerCase()
            .replace(/[\s_+]+/g, '-');

        return slugToValue[normalized]
            ? normalized
            : '2-way-pallet';
    }

    const url = new URL(window.location.href);
    const selected = normalizeSelection(
        url.searchParams.get('selected')
    );

    dropdown.value = slugToValue[selected];
    dropdown.disabled = false;

    dropdown.addEventListener('change', function () {
        const slug = valueToSlug[this.value];

        if (!slug) return;

        const nextUrl = new URL(window.location.href);

        if (slug === '2-way-pallet') {
            nextUrl.searchParams.delete('selected');
        } else {
            nextUrl.searchParams.set('selected', slug);
        }

        nextUrl.hash = '';

        if (nextUrl.href !== window.location.href) {
            window.location.assign(nextUrl.href);
        }
    });
});
</script>
