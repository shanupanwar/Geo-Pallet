<script>
				( () => {
					const lazyloadRunObserver = () => {
						const lazyloadBackgrounds = document.querySelectorAll( `.e-con.e-parent:not(.e-lazyloaded)` );
						const lazyloadBackgroundObserver = new IntersectionObserver( ( entries ) => {
							entries.forEach( ( entry ) => {
								if ( entry.isIntersecting ) {
									let lazyloadBackground = entry.target;
									if( lazyloadBackground ) {
										lazyloadBackground.classList.add( 'e-lazyloaded' );
									}
									lazyloadBackgroundObserver.unobserve( entry.target );
								}
							});
						}, { rootMargin: '200px 0px 200px 0px' } );
						lazyloadBackgrounds.forEach( ( lazyloadBackground ) => {
							lazyloadBackgroundObserver.observe( lazyloadBackground );
						} );
					};
					const events = [
						'DOMContentLoaded',
						'elementor/lazyload/observe',
					];
					events.forEach( ( event ) => {
						document.addEventListener( event, lazyloadRunObserver );
					} );
				} )();
			</script>
<script id="gp-mobile-header-fix-script-v5">
    (function () {

        'use strict';

        const MOBILE_MAX = 1024;

        const MENU_SELECTOR =
            '#menu-2-460af18';

        const HEADER_SELECTOR =
            '.elementor-element-2fe2a74';

        const NAV_SELECTOR =
            '.elementor-element-2fe2a74 ' +
            '.elementor-element-460af18';

        const DROPDOWN_SELECTOR =
            NAV_SELECTOR +
            ' .elementor-nav-menu--dropdown';

        const TOGGLE_SELECTOR =
            NAV_SELECTOR +
            ' .elementor-menu-toggle';

        const LOGO_SELECTOR =
            '.elementor-element-2fe2a74 ' +
            '.elementor-element-a4e0b3a';

        const mobileQuery = window.matchMedia(
            '(max-width: ' + MOBILE_MAX + 'px)'
        );

        let resizeTimer = null;

        function isMobile() {
            return mobileQuery.matches;
        }

        /* Insert CTA buttons once */

        function insertMobileMenuButtons() {

            if (!isMobile()) {
                return;
            }

            const menu = document.querySelector(
                MENU_SELECTOR
            );

            if (!menu) {
                return;
            }

            if (
                menu.querySelector(
                    '.gp-mobile-menu-actions-item'
                )
            ) {
                return;
            }

            const item = document.createElement('li');

            item.className =
                'menu-item gp-mobile-menu-actions-item';

            const actions = document.createElement('div');

            actions.className =
                'gp-mobile-menu-actions';

            const call = document.createElement('a');

            call.className =
                'elementor-button ' +
                'elementor-button-link ' +
                'elementor-size-md ' +
                'gp-mobile-menu-call';

            call.href = 'tel:6045844368';
            call.textContent = "Let's talk";

            const quote = document.createElement('a');

            quote.className =
                'elementor-button ' +
                'elementor-button-link ' +
                'elementor-size-md ' +
                'gp-mobile-menu-quote';

            quote.href =
                '{{HOME}}/#form';

            quote.textContent = 'Get a quote';

            actions.appendChild(call);
            actions.appendChild(quote);

            item.appendChild(actions);
            menu.appendChild(item);
        }

        /* Position dropdown below header */

        function fixMobileDropdownPosition() {

            if (!isMobile()) {
                return;
            }

            const dropdown = document.querySelector(
                DROPDOWN_SELECTOR
            );

            const header = document.querySelector(
                HEADER_SELECTOR
            );

            if (!dropdown || !header) {
                return;
            }

            const logo = document.querySelector(
                LOGO_SELECTOR
            );

            const toggle = document.querySelector(
                TOGGLE_SELECTOR
            );

            const bottomEdges = [
                header.getBoundingClientRect().bottom
            ];

            if (logo) {
                bottomEdges.push(
                    logo.getBoundingClientRect().bottom
                );
            }

            if (toggle) {
                bottomEdges.push(
                    toggle.getBoundingClientRect().bottom
                );
            }

            const menuTop = Math.max(
                0,
                Math.round(
                    Math.max(...bottomEdges)
                )
            );

            /* Remove Elementor inline positioning */

            [
                'left',
                'right',
                'top',
                'width',
                'max-width',
                'min-width',
                'transform'
            ].forEach(function (property) {

                dropdown.style.removeProperty(property);

            });

            dropdown.style.setProperty(
                '--gp-mobile-menu-top',
                menuTop + 'px'
            );
        }

        /* Initialize mobile header */

        function initMobileHeader() {

            if (!isMobile()) {
                return;
            }

            insertMobileMenuButtons();
            fixMobileDropdownPosition();
        }

        /* Reset mobile positioning on desktop */

        function resetDesktopHeader() {

            const dropdown = document.querySelector(
                DROPDOWN_SELECTOR
            );

            if (!dropdown) {
                return;
            }

            dropdown.style.removeProperty(
                '--gp-mobile-menu-top'
            );
        }

        /* Handle responsive changes */

        function updateResponsiveHeader() {

            if (isMobile()) {

                initMobileHeader();

            } else {

                resetDesktopHeader();

            }
        }

        /* Initial page load */

        function start() {

            window.requestAnimationFrame(
                updateResponsiveHeader
            );

        }

        if (document.readyState === 'loading') {

            document.addEventListener(
                'DOMContentLoaded',
                start,
                { once: true }
            );

        } else {

            start();

        }

        /* Hamburger click */

        document.addEventListener(
            'click',
            function (event) {

                if (!isMobile()) {
                    return;
                }

                const target = event.target;

                if (!(target instanceof Element)) {
                    return;
                }

                const toggle = target.closest(
                    TOGGLE_SELECTOR
                );

                if (!toggle) {
                    return;
                }

                window.requestAnimationFrame(
                    fixMobileDropdownPosition
                );
            }
        );

        /* Debounced resize */

        window.addEventListener(
            'resize',
            function () {

                window.clearTimeout(
                    resizeTimer
                );

                resizeTimer = window.setTimeout(
                    function () {

                        window.requestAnimationFrame(
                            updateResponsiveHeader
                        );

                    },
                    150
                );

            },
            { passive: true }
        );

        /* Orientation change */

        window.addEventListener(
            'orientationchange',
            function () {

                window.requestAnimationFrame(
                    updateResponsiveHeader
                );

            }
        );

        /* Breakpoint transition */

        if (mobileQuery.addEventListener) {

            mobileQuery.addEventListener(
                'change',
                updateResponsiveHeader
            );

        } else if (mobileQuery.addListener) {

            mobileQuery.addListener(
                updateResponsiveHeader
            );

        }

        /* Elementor frontend initialization */

        if (window.jQuery) {

            jQuery(window).on(
                'elementor/frontend/init',
                function () {

                    window.requestAnimationFrame(
                        updateResponsiveHeader
                    );

                }
            );
        }

    })();
    </script>
<script id="gp-form9-phone-script">
    (function () {

        'use strict';

        const FORM_ID = 9;
        const WRAPPER_ID = 'gform_wrapper_9';
        const FORM_SELECTOR = '#gform_9';

        let buildScheduled = false;
        let observedWrapper = null;
        let resizeObserver = null;


        /* =====================================================
           PHONE FORMAT
           ===================================================== */

        function formatPhone(value) {

            let digits =
                String(value || '')
                    .replace(/\D/g, '');


            /*
             * Remove leading North American country code.
             */
            if (
                digits.length === 11 &&
                digits.charAt(0) === '1'
            ) {
                digits =
                    digits.substring(1);
            }


            digits =
                digits.substring(0, 10);


            if (digits.length > 6) {

                return (
                    digits.substring(0, 3) +
                    ' ' +
                    digits.substring(3, 6) +
                    ' ' +
                    digits.substring(6)
                );
            }


            if (digits.length > 3) {

                return (
                    digits.substring(0, 3) +
                    ' ' +
                    digits.substring(3)
                );
            }


            return digits;
        }


        /* =====================================================
           HIDDEN COMBINED PHONE
           ===================================================== */

        function updateHiddenPhone(
            countryInput,
            phoneInput,
            hiddenField
        ) {

            if (!hiddenField) {
                return;
            }


            const country =
                countryInput
                    ? countryInput.value
                    : '';


            const phone =
                phoneInput
                    ? phoneInput.value
                    : '';


            hiddenField.value =
                (country + ' ' + phone).trim();
        }


        /* =====================================================
           COUNTRY OPTIONS
           ===================================================== */

        function normalizeCountryOptions(
            countryInput,
            compact
        ) {

            if (!countryInput) {
                return;
            }


            Array.from(
                countryInput.options
            ).forEach(function (option) {

                const value =
                    option.value.trim();

                const text =
                    option.text.trim();


                if (
                    value === 'US' ||
                    value === 'US +1' ||
                    text === 'US' ||
                    text === 'US +1'
                ) {

                    option.value =
                        'US +1';

                    option.text =
                        compact
                            ? 'US'
                            : 'US +1';
                }


                if (
                    value === 'Canada' ||
                    value === 'Canada +1' ||
                    text === 'Canada' ||
                    text === 'Canada +1' ||
                    text === 'CA'
                ) {

                    option.value =
                        'Canada +1';

                    option.text =
                        compact
                            ? 'CA'
                            : 'Canada +1';
                }
            });
        }


        /* =====================================================
           COMPACT / RESPONSIVE STATE
           ===================================================== */

        function updateCompactState(
            wrapper,
            width
        ) {

            if (!wrapper) {
                return;
            }


            const compact =
                width < 420;


            /*
             * Avoid doing DOM/class work when
             * the responsive state has not changed.
             */
            const oldState =
                wrapper.dataset.gpCompactState;


            const newState =
                compact
                    ? '1'
                    : '0';


            if (oldState === newState) {
                return;
            }


            wrapper.dataset.gpCompactState =
                newState;


            wrapper.classList.toggle(
                'gp-compact-form',
                compact
            );


            const countryInput =
                wrapper.querySelector(
                    '#input_9_19'
                );


            normalizeCountryOptions(
                countryInput,
                compact
            );
        }


        /* =====================================================
           CLEAN PHONE VALIDATION MESSAGE
           ===================================================== */

        function fixPhoneValidationMessage(
            form
        ) {

            if (!form) {
                return;
            }


            const wrap =
                form.querySelector(
                    '.gp-phone-combo-wrap'
                );


            const combo =
                form.querySelector(
                    '.gp-phone-combo'
                );


            const countryField =
                form.querySelector(
                    '#field_9_19'
                );


            const phoneField =
                form.querySelector(
                    '#field_9_13'
                );


            if (
                !wrap ||
                !combo ||
                !phoneField
            ) {
                return;
            }


            const existingMessage =
                wrap.querySelector(
                    '.gp-phone-combo-error'
                );


            if (existingMessage) {
                existingMessage.remove();
            }


            wrap.classList.remove(
                'gp-phone-has-error'
            );


            const messages = [];


            if (countryField) {

                countryField
                    .querySelectorAll(
                        '.gfield_validation_message, ' +
                        '.validation_message'
                    )
                    .forEach(function (message) {

                        const text =
                            message.textContent.trim();

                        if (text) {
                            messages.push(text);
                        }
                    });
            }


            phoneField
                .querySelectorAll(
                    '.gfield_validation_message, ' +
                    '.validation_message'
                )
                .forEach(function (message) {

                    const text =
                        message.textContent.trim();

                    if (text) {
                        messages.push(text);
                    }
                });


            if (!messages.length) {
                return;
            }


            /*
             * First unique message is enough because
             * the two fields represent one visual control.
             */
            const uniqueMessages =
                Array.from(
                    new Set(messages)
                );


            const cleanMessage =
                document.createElement('div');


            cleanMessage.className =
                'gp-phone-combo-error';


            cleanMessage.textContent =
                uniqueMessages[0];


            combo.insertAdjacentElement(
                'afterend',
                cleanMessage
            );


            wrap.classList.add(
                'gp-phone-has-error'
            );
        }


        /* =====================================================
           ATTACH INPUT LISTENERS ONCE
           ===================================================== */

        function initializePhoneEvents(
            countryInput,
            phoneInput,
            hiddenField
        ) {

            if (
                !countryInput ||
                !phoneInput
            ) {
                return;
            }


            if (
                !phoneInput.dataset
                    .gpResponsivePhoneReady
            ) {

                phoneInput.dataset
                    .gpResponsivePhoneReady = '1';


                phoneInput.addEventListener(
                    'input',
                    function () {

                        const formatted =
                            formatPhone(
                                this.value
                            );


                        /*
                         * Avoid assigning when there
                         * is no actual value change.
                         */
                        if (
                            this.value !==
                            formatted
                        ) {
                            this.value =
                                formatted;
                        }


                        updateHiddenPhone(
                            countryInput,
                            phoneInput,
                            hiddenField
                        );
                    }
                );


                phoneInput.addEventListener(
                    'blur',
                    function () {

                        const formatted =
                            formatPhone(
                                this.value
                            );


                        if (
                            this.value !==
                            formatted
                        ) {
                            this.value =
                                formatted;
                        }


                        updateHiddenPhone(
                            countryInput,
                            phoneInput,
                            hiddenField
                        );
                    }
                );
            }


            if (
                !countryInput.dataset
                    .gpResponsiveCountryReady
            ) {

                countryInput.dataset
                    .gpResponsiveCountryReady = '1';


                countryInput.addEventListener(
                    'change',
                    function () {

                        updateHiddenPhone(
                            countryInput,
                            phoneInput,
                            hiddenField
                        );
                    }
                );
            }
        }


        /* =====================================================
           BUILD THE CONNECTED FIELD
           ===================================================== */

        function buildPhoneField() {

            const wrapper =
                document.getElementById(
                    WRAPPER_ID
                );


            if (!wrapper) {
                return;
            }


            const form =
                wrapper.querySelector(
                    FORM_SELECTOR
                );


            if (!form) {
                return;
            }


            const fieldsContainer =
                form.querySelector(
                    '#gform_fields_9'
                );


            const countryField =
                form.querySelector(
                    '#field_9_19'
                );


            const phoneField =
                form.querySelector(
                    '#field_9_13'
                );


            const countryInput =
                form.querySelector(
                    '#input_9_19'
                );


            const phoneInput =
                form.querySelector(
                    '#input_9_13'
                );


            const hiddenField =
                form.querySelector(
                    '#input_9_20'
                );


            if (
                !fieldsContainer ||
                !countryField ||
                !phoneField ||
                !countryInput ||
                !phoneInput
            ) {
                return;
            }


            /* ---------------------------------------------
               Build wrapper ONLY if not already built
               --------------------------------------------- */

            let combinedWrapper =
                form.querySelector(
                    '.gp-phone-combo-wrap'
                );


            if (!combinedWrapper) {

                combinedWrapper =
                    document.createElement(
                        'div'
                    );


                combinedWrapper.className =
                    'gfield gp-phone-combo-wrap';


                const label =
                    document.createElement(
                        'label'
                    );


                label.className =
                    'gp-phone-combo-label';


                label.textContent =
                    'Phone Number';


                const combo =
                    document.createElement(
                        'div'
                    );


                combo.className =
                    'gp-phone-combo';


                fieldsContainer.insertBefore(
                    combinedWrapper,
                    countryField
                );


                combinedWrapper.appendChild(
                    label
                );


                combinedWrapper.appendChild(
                    combo
                );


                combo.appendChild(
                    countryField
                );


                combo.appendChild(
                    phoneField
                );
            }


            /* ---------------------------------------------
               Input attributes
               --------------------------------------------- */

            phoneInput.setAttribute(
                'inputmode',
                'numeric'
            );


            phoneInput.setAttribute(
                'autocomplete',
                'tel-national'
            );


            phoneInput.setAttribute(
                'placeholder',
                'Enter phone number'
            );


            phoneInput.setAttribute(
                'maxlength',
                '12'
            );


            /*
             * Remove old demo/default numbers.
             */
            if (
                phoneInput.value ===
                    '604 584 4368' ||
                phoneInput.value ===
                    '555 555 5555'
            ) {
                phoneInput.value = '';
            }


            /* ---------------------------------------------
               Responsive state
               --------------------------------------------- */

            updateCompactState(
                wrapper,
                wrapper.getBoundingClientRect()
                    .width
            );


            /* ---------------------------------------------
               Event listeners
               --------------------------------------------- */

            initializePhoneEvents(
                countryInput,
                phoneInput,
                hiddenField
            );


            /* ---------------------------------------------
               Initial formatting
               --------------------------------------------- */

            const formatted =
                formatPhone(
                    phoneInput.value
                );


            if (
                phoneInput.value !==
                formatted
            ) {
                phoneInput.value =
                    formatted;
            }


            updateHiddenPhone(
                countryInput,
                phoneInput,
                hiddenField
            );


            fixPhoneValidationMessage(
                form
            );


            observeWrapper(
                wrapper
            );
        }


        /* =====================================================
           RESIZE OBSERVER
           ONLY changes responsive state.
           It does NOT rebuild the form.
           ===================================================== */

        function observeWrapper(
            wrapper
        ) {

            if (
                !('ResizeObserver' in window) ||
                !wrapper
            ) {
                return;
            }


            if (!resizeObserver) {

                resizeObserver =
                    new ResizeObserver(
                        function (entries) {

                            entries.forEach(
                                function (entry) {

                                    updateCompactState(
                                        entry.target,
                                        entry.contentRect.width
                                    );
                                }
                            );
                        }
                    );
            }


            if (
                observedWrapper ===
                wrapper
            ) {
                return;
            }


            if (observedWrapper) {

                resizeObserver.unobserve(
                    observedWrapper
                );
            }


            observedWrapper =
                wrapper;


            resizeObserver.observe(
                wrapper
            );
        }


        /* =====================================================
           SCHEDULER
           Combines duplicate GF events into ONE build.
           ===================================================== */

        function scheduleBuild() {

            if (buildScheduled) {
                return;
            }


            buildScheduled = true;


            window.requestAnimationFrame(
                function () {

                    buildScheduled = false;

                    buildPhoneField();
                }
            );
        }


        /* =====================================================
           INITIAL LOAD
           ===================================================== */

        if (
            document.readyState ===
            'loading'
        ) {

            document.addEventListener(
                'DOMContentLoaded',
                scheduleBuild,
                {
                    once: true
                }
            );

        } else {

            scheduleBuild();
        }


        /* =====================================================
           MODERN GRAVITY FORMS EVENT
           ===================================================== */

        document.addEventListener(
            'gform/postRender',
            function (event) {

                /*
                 * Newer Gravity Forms includes formId
                 * in event.detail.
                 */
                if (
                    event.detail &&
                    Number(
                        event.detail.formId
                    ) !== FORM_ID
                ) {
                    return;
                }


                scheduleBuild();
            }
        );


        /* =====================================================
           LEGACY / CURRENT jQuery GF EVENTS
           Needed after AJAX validation/re-render.
           ===================================================== */

        if (window.jQuery) {

            jQuery(document).on(
                'gform_post_render ' +
                'gform_page_loaded ' +
                'gform_post_validation',
                function (
                    event,
                    formId
                ) {

                    if (
                        Number(formId) !==
                        FORM_ID
                    ) {
                        return;
                    }


                    scheduleBuild();
                }
            );
        }

    })();
    </script>
